name: Sync Oyster Menu from Toast

# Runs every 15 minutes between 11 AM and 11 PM Eastern Time.
# Triggerable manually from the Actions tab at any time.
on:
  schedule:
    # UTC equivalents of 11 AM – 11 PM ET
    - cron: '*/15 15-23 * * *'   # 3 PM – 11:59 PM UTC  (11 AM – 7:59 PM ET)
    - cron: '*/15 0-3 * * *'     # 12 AM – 3:59 AM UTC  (8 PM – 11:59 PM ET)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install firebase-admin@^13

      - name: Write Firebase service account credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}
        run: echo "$FIREBASE_CREDENTIALS" > /tmp/firebase-key.json

      - name: Verify secrets are present
        env:
          TOAST_CLIENT_ID:     ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_LOCATION_ID:   ${{ secrets.TOAST_RESTAURANT_GUID }}
        run: |
          echo "TOAST_CLIENT_ID length:     $(echo -n "$TOAST_CLIENT_ID" | wc -c)"
          echo "TOAST_CLIENT_SECRET length: $(echo -n "$TOAST_CLIENT_SECRET" | wc -c)"
          echo "TOAST_LOCATION_ID length:   $(echo -n "$TOAST_LOCATION_ID" | wc -c)"

      - name: Run Toast → Firebase sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          TOAST_CLIENT_ID:       ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET:   ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_LOCATION_ID:     ${{ secrets.TOAST_RESTAURANT_GUID }}
          FIREBASE_DATABASE_URL: https://half-shell-oyster-menu-default-rtdb.firebaseio.com
        run: node tools/sync-toast-to-firebase.js

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/firebase-key.json
