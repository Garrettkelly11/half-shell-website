name: Sync Oyster Menu from Toast

# No schedule (removed 11/17/2026): GitHub ran the 15-minute cron only a few
# times a day. Every run is now started through the API by a server function
# (cloud/index.js), with the same GitHub token:
#   - startToastSync: the employee page's Sync Toast button
#   - toastWebhook:   Toast stock and menu events, 5-minute cooldown; an event
#                     inside the cooldown asks for a catch-up run with
#                     delay_seconds, so this run waits, then reads Toast
#   - refreshMenu:    a guest opens the menu and nothing has synced in 30 min
# Runs can also be started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read Toast and Firebase, print the writes, write nothing'
        type: boolean
        default: false
      trigger:
        description: 'What started this run (shown in the log and the audit log)'
        type: string
        default: 'Manual sync'
      delay_seconds:
        description: 'Wait this many seconds before reading Toast (webhook catch-up run; max 300)'
        type: string
        default: '0'

# Read-only token: the sync writes to Firebase with its own secret and never
# pushes to the repo, so nothing here needs write access to main.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install firebase-admin@^13

      - name: Write Firebase service account credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}
        run: echo "$FIREBASE_CREDENTIALS" > /tmp/firebase-key.json

      - name: Verify secrets are present
        env:
          TOAST_CLIENT_ID:     ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_LOCATION_ID:   ${{ secrets.TOAST_RESTAURANT_GUID }}
        run: |
          echo "TOAST_CLIENT_ID length:     $(echo -n "$TOAST_CLIENT_ID" | wc -c)"
          echo "TOAST_CLIENT_SECRET length: $(echo -n "$TOAST_CLIENT_SECRET" | wc -c)"
          echo "TOAST_LOCATION_ID length:   $(echo -n "$TOAST_LOCATION_ID" | wc -c)"

      - name: Wait out the webhook cooldown
        if: inputs.delay_seconds != '' && inputs.delay_seconds != '0'
        env:
          DELAY: ${{ inputs.delay_seconds }}
        run: |
          case "$DELAY" in *[!0-9]*) echo "delay_seconds must be a whole number"; exit 1;; esac
          if [ "$DELAY" -gt 300 ]; then DELAY=300; fi
          echo "Catch-up run: waiting ${DELAY}s before reading Toast"
          sleep "$DELAY"

      - name: Run Toast → Firebase sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          TOAST_CLIENT_ID:       ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET:   ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_LOCATION_ID:     ${{ secrets.TOAST_RESTAURANT_GUID }}
          FIREBASE_DATABASE_URL: https://half-shell-oyster-menu-default-rtdb.firebaseio.com
          SYNC_TRIGGER:          ${{ inputs.trigger }}
        run: node tools/sync-toast-to-firebase.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/firebase-key.json
